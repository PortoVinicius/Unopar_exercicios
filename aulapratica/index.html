<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Responsiva com Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        header {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .coluna {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Meu Site Responsivo</h1>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container my-4">
        <div class="row">
            
            <!-- Coluna 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="coluna">
                    <h3>Coluna 1</h3>
                    <p>Conteúdo da primeira coluna.</p>
                </div>
            </div>

            <!-- Coluna 2 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="coluna">
                    <h3>Coluna 2</h3>
                    <p>Conteúdo da segunda coluna.</p>
                </div>
            </div>

            <!-- Coluna 3 -->
            <div class="col-12 col-md-12 col-lg-4">
                <div class="coluna">
                    <h3>Coluna 3</h3>
                    <p>Conteúdo da terceira coluna.</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2025 - Meu Site Responsivo</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
